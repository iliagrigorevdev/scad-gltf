<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/preview.css" />
  </head>
  <body>
    <div id="viewer-container">
      <div id="top-ui">
        <div id="save-ui">
          <input type="text" id="filename-input" placeholder="Name" />
          <button id="save-btn">Save</button>
          <button id="open-editor-btn">Edit</button>
        </div>
        <div id="viewer-controls">
          <label
            ><input type="checkbox" id="show-grid-cb" checked /> Grid</label
          >
          <label><input type="checkbox" id="wireframe-cb" /> Wireframe</label>
          <button id="screenshot-btn" title="Take Screenshot & Add to Chat">
            📷
          </button>
          <button id="fullscreen-btn" title="Toggle Full Screen">⛶</button>
        </div>
      </div>
      <div id="anim-controls" style="display: none">
        <button id="anim-play-btn">⏸ Pause</button>
        <select id="anim-select"></select>
        <select id="camera-select" style="display: none"></select>
        <input
          type="range"
          id="anim-slider"
          min="0"
          max="1"
          step="0.001"
          value="0"
        />
      </div>
      <div id="viewer"></div>
    </div>
    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
